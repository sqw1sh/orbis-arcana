name: Release

# Pushing a tag like v1.0.0 builds the mod, runs the tests and publishes a GitHub Release
# with the mod jar, the api jar and the example addon; the notes come from CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit tests
        run: ./gradlew build --console=plain

      - name: GameTests
        run: ./gradlew runGameTestServer --console=plain

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v {on=1; next} /^## / {on=0} on' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Orbis Arcana ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            build/libs/orbisarcana-*.jar
            example-addon/build/libs/orbisexample-*.jar
