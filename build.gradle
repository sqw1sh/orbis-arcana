plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Visual check: loads run/saves/devtest, screenshots the circle stand in every render mode, quits.
        // Put optional mods (e.g. Iris/Sodium) into run/mods and shader packs into run/shaderpacks.
        clientShot {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'devtest', '--width', '1280', '--height', '720'
            systemProperty 'orbisarcana.devshot', 'true'
            // ./gradlew runClientShot -Pshots=radial,grimoire  -> only these scenes
            if (project.hasProperty('shots')) systemProperty 'orbisarcana.devshot.only', project.property('shots')
            // Strict GPU validation is IDE-only; third-party mods like Iris trip it, production never runs it
            systemProperty 'neoforge.disableBlaze3DValidation', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Puts Minecraft/NeoForge on the JUnit classpath (codec and data tests)
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // Curios API: optional accessories (§11.2), only compat/curios touches it
    maven { url = 'https://maven.theillusivec4.top/' }
    // JEI (§17)
    maven { url = 'https://maven.blamejared.com/' }
    // Jade (§17), from Modrinth
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // GeckoLib (models, animations of spells, foci, creatures) and Player Animation Library (caster poses): required
    implementation "maven.modrinth:geckolib:${geckolib_version}"
    implementation "maven.modrinth:player-animation-library:${pal_version}"

    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    // Curios sends its own packets to every joining player, which breaks GameTest mock players: only with -PwithCurios
    if (project.hasProperty('withCurios') || project.hasProperty('withCompat')) localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // JEI and Jade: their plugins in compat/jei and compat/jade are found and loaded by those mods only
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    // In dev runs only with -PwithCompat (JEI + Jade + Curios), so GameTests keep running without them
    if (project.hasProperty('withCompat')) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
        localRuntime "maven.modrinth:jade:${jade_version}"
    }

    // Pure-Java core (com.orbisarcana.core) is unit-tested without Minecraft
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // MDG runs tests from its own working directory; tests read bundled data from here
    systemProperty 'orbisarcana.resources', file('src/main/resources').absolutePath
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Builds the jar and copies it into the Prism test instance (old orbisarcana jars are removed first)
tasks.register('deployJar') {
    group = 'orbisarcana'
    dependsOn tasks.named('jar')
    var jarFile = tasks.named('jar').flatMap { it.archiveFile }
    var modsDir = file(project.prism_instance_mods)
    var modId = project.mod_id
    doLast {
        modsDir.mkdirs()
        modsDir.listFiles({ f -> f.name.startsWith(modId + '-') && f.name.endsWith('.jar') } as FileFilter)?.each { it.delete() }
        java.nio.file.Files.copy(jarFile.get().asFile.toPath(), new File(modsDir, jarFile.get().asFile.name).toPath())
        println "Deployed ${jarFile.get().asFile.name} -> ${modsDir}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// The addon API (§16) as its own artifact: com.orbisarcana.api and the pure-Java rules in com.orbisarcana.core.
// Addons that only listen to events, register schools or read services compile against it;
// new spell behaviors still need the full jar (CastContext and SpellDefinition are not in the API yet).
var apiJar = tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from(sourceSets.main.output) {
        include 'com/orbisarcana/api/**'
        include 'com/orbisarcana/core/**'
    }
}
tasks.named('assemble') { dependsOn apiJar }
